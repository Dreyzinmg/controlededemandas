<title>One Page — Três Marias</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase compat — DEVE vir antes de qualquer script que use firebase.* -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #1B4332 0%, #2D6A4F 50%, #40916C 100%);
  }

  .card {
    background: white;
    border-radius: 20px;
    padding: 48px 44px 44px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 24px 64px rgba(0,0,0,.22);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo {
    width: 64px; height: 64px;
    background: #1B4332;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
    box-shadow: 0 4px 16px rgba(27,67,50,.35);
  }

  .card-title {
    font-size: 22px; font-weight: 700;
    color: #111827; margin-bottom: 6px;
    text-align: center;
  }
  .card-sub {
    font-size: 12.5px; color: #6B7280;
    text-align: center; line-height: 1.5;
    margin-bottom: 36px;
  }

  .field { width: 100%; margin-bottom: 18px; }
  .field label {
    display: block; font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .8px;
    color: #374151; margin-bottom: 7px;
  }
  .field input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid #D1D5DB;
    border-radius: 10px; font-family: inherit;
    font-size: 14px; color: #111827;
    transition: border-color .2s, box-shadow .2s;
    outline: none;
  }
  .field input:focus {
    border-color: #2D6A4F;
    box-shadow: 0 0 0 3px rgba(45,106,79,.12);
  }
  .field input::placeholder { color: #9CA3AF; }

  .btn-login {
    width: 100%; padding: 13px;
    background: #1B4332; color: white;
    border: none; border-radius: 10px;
    font-family: inherit; font-size: 14.5px;
    font-weight: 600; cursor: pointer;
    transition: background .2s, transform .1s;
    margin-top: 6px;
  }
  .btn-login:hover  { background: #2D6A4F; }
  .btn-login:active { transform: scale(.985); }
  .btn-login:disabled { opacity: .6; cursor: default; }

  .error-msg {
    width: 100%; margin-top: 14px;
    background: #FDECEA; border: 1px solid #EF9A9A;
    border-radius: 8px; padding: 10px 14px;
    font-size: 12.5px; color: #C62828;
    text-align: center; display: none;
  }
  .error-msg.show { display: block; }

  .loader {
    width: 16px; height: 16px;
    border: 2.5px solid rgba(255,255,255,.4);
    border-top-color: white; border-radius: 50%;
    animation: spin .7s linear infinite;
    display: inline-block; vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer-txt {
    margin-top: 28px; font-size: 11px;
    color: #9CA3AF; text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
      <path d="M17 4C17 4 6 10 6 20C6 25.5 11 29 17 29C23 29 28 25.5 28 20C28 10 17 4 17 4Z" fill="#52B788"/>
      <path d="M17 4C17 4 17 14 12 22" stroke="#1B4332" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="card-title">One Page — Três Marias</div>
  <div class="card-sub">Combio Energias Renováveis · PCM · Gestão de Manutenção</div>

  <div class="field">
    <label>E-mail Corporativo</label>
    <input type="email" id="inp-email" placeholder="seu@combio.com.br" autocomplete="email">
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="inp-pass" placeholder="••••••••••" autocomplete="current-password">
  </div>

  <button class="btn-login" id="btn-login">Entrar</button>
  <div class="error-msg" id="error-msg"></div>
  <div class="footer-txt">Acesso restrito · Combio Energias Renováveis</div>
</div>

<!-- Lógica de login — Firebase já carregado no <head> -->
<script>
  const firebaseConfig = {
    apiKey:            "AIzaSyDNSrR2yfN75ChKvPW78trJ8Hh5JJPVTqo",
    authDomain:        "onepage-combio-tresmarias.firebaseapp.com",
    databaseURL:       "https://onepage-combio-tresmarias-default-rtdb.firebaseio.com",
    projectId:         "onepage-combio-tresmarias",
    storageBucket:     "onepage-combio-tresmarias.firebasestorage.app",
    messagingSenderId: "699908934102",
    appId:             "1:699908934102:web:3bf292d4135b56fff13c77"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // Se já está logado, redireciona direto para o painel
  auth.onAuthStateChanged(function(user) {
    if (user) {
      window.location.href = './bom_dia_trm.html';
    }
  });

  var btnLogin = document.getElementById('btn-login');
  var inpEmail = document.getElementById('inp-email');
  var inpPass  = document.getElementById('inp-pass');
  var errMsg   = document.getElementById('error-msg');

  var erros = {
    'auth/invalid-email':          'E-mail inválido.',
    'auth/user-not-found':         'Usuário não encontrado.',
    'auth/wrong-password':         'Senha incorreta.',
    'auth/invalid-credential':     'E-mail ou senha incorretos.',
    'auth/too-many-requests':      'Muitas tentativas. Aguarde alguns minutos.',
    'auth/network-request-failed': 'Sem conexão. Verifique sua internet.',
    'auth/user-disabled':          'Esta conta foi desativada.',
  };

  function doLogin() {
    var email = inpEmail.value.trim();
    var pass  = inpPass.value;

    errMsg.classList.remove('show');

    if (!email || !pass) {
      errMsg.textContent = 'Preencha e-mail e senha.';
      errMsg.classList.add('show');
      return;
    }

    btnLogin.disabled = true;
    btnLogin.innerHTML = '<span class="loader"></span>Entrando...';

    auth.signInWithEmailAndPassword(email, pass)
      .catch(function(e) {
        errMsg.textContent = erros[e.code] || ('Erro: ' + e.message);
        errMsg.classList.add('show');
        btnLogin.disabled  = false;
        btnLogin.innerHTML = 'Entrar';
      });
    // sucesso: onAuthStateChanged redireciona automaticamente
  }

  btnLogin.addEventListener('click', doLogin);
  inpPass.addEventListener('keydown',  function(e) { if (e.key === 'Enter') doLogin(); });
  inpEmail.addEventListener('keydown', function(e) { if (e.key === 'Enter') inpPass.focus(); });
</script>
</body>
</html>
